<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="四杆机构"><title>四杆机构分析器</title><style>body{margin:0;background:#101827;color:#e8eef8;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:650px;margin:auto;padding:18px}h2{margin:8px 0 16px}.panel{background:#1c293b;border-radius:14px;padding:15px;margin:12px 0}canvas{width:100%;background:#132033;border-radius:8px}label{display:flex;justify-content:space-between;margin-top:12px}input[type=range]{width:100%;accent-color:#36b7a8}input[type=number]{width:88px;background:#101827;color:#e8eef8;border:1px solid #61748d;border-radius:6px;padding:6px;font-size:15px}label{gap:8px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#26374d;padding:12px;border-radius:9px}.stat b{display:block;font-size:19px;margin-top:6px}button{background:#334b67;border:0;color:white;border-radius:9px;padding:10px 14px;margin:4px}small{color:#afc0d2}</style></head><body><main><h2>四杆机构分析器</h2><section class="panel"><canvas id="drawing" width="640" height="380"></canvas><label>输入角 <b id="angval"></b></label><input id="ang" type="range" min="0" max="360" value="50"><button id="play">播放</button><button id="reset">重置</button></section><section class="panel" id="sliders"></section><section class="panel"><label>输入扭矩 <input id="ntor" type="number" min="0.01" max="20" step="0.01" aria-label="输入扭矩数值"><b id="torval"></b></label><input id="tor" type="range" min="0.01" max="20" step="0.01" value="1"></section><section class="panel"><strong>曲柄 / 摇杆角度范围（随杆长实时更新）</strong><div class="stats" id="angle-ranges" style="margin-top:10px"></div><small id="range-note"></small></section><section class="stats" id="stats"></section><section class="panel"><label>运动曲线 <select id="curve"><option value="ratio">角速度比</option><option value="mu">传动角</option><option value="out">输出角</option><option value="force">连杆轴向力</option></select></label><canvas id="plot" width="640" height="280"></canvas><small>曲线断开表示该输入角无几何解；极端值可能被裁剪。</small></section><small>平面刚性四杆理想模型；不含惯量、摩擦和冲击。数据保存在本机浏览器。</small></main><script>
const keys=['a','b','c','d'],labels=['曲柄 a','连杆 b','摇杆 c','机架 d'],colors=['#f4ad4e','#39c5b7','#a59af5','#94a5ba'];let state;try{state=JSON.parse(localStorage.getItem('fourbar-state'))}catch(e){}state={a:20,b:60,c:30,d:50,ang:50,tor:1,...state};let running=false;const $=id=>document.getElementById(id),rad=Math.PI/180;function save(){localStorage.setItem('fourbar-state',JSON.stringify(state))}keys.forEach((k,i)=>{$('sliders').insertAdjacentHTML('beforeend',`<label>${labels[i]} <input id="n${k}" type="number" min="1" max="500" step="0.1" aria-label="${labels[i]}数值"><b id="v${k}"></b></label><input id="s${k}" type="range" min="1" max="500" step="1">`);$('s'+k).oninput=e=>{state[k]=+e.target.value;update()};$('n'+k).onchange=e=>{let v=+e.target.value;if(Number.isFinite(v)&&v>=1&&v<=500)state[k]=v;update()}});$('ang').oninput=e=>{running=false;state.ang=+e.target.value;update()};$('tor').oninput=e=>{state.tor=+e.target.value;update()};$('ntor').onchange=e=>{let v=+e.target.value;if(Number.isFinite(v)&&v>=0.01&&v<=20)state.tor=v;update()};$('play').onclick=()=>{running=!running;$('play').textContent=running?'暂停':'播放'};$('reset').onclick=()=>{state={a:20,b:60,c:30,d:50,ang:50,tor:1};update()};$('curve').onchange=update;
function solve(deg){let {a,b,c,d,tor}=state,t=deg*rad,B={x:a*Math.cos(t),y:a*Math.sin(t)},D={x:d,y:0},dx=D.x-B.x,dy=D.y-B.y,q=Math.hypot(dx,dy);if(q<1e-8||q>b+c||q<Math.abs(b-c))return null;let u=(b*b-c*c+q*q)/(2*q),h=Math.sqrt(Math.max(0,b*b-u*u)),ex=dx/q,ey=dy/q,C={x:B.x+u*ex-h*ey,y:B.y+u*ey+h*ex},phi=Math.atan2(C.y,c?C.x-d:0),beta=Math.atan2(C.y-B.y,C.x-B.x),det=Math.sin(phi-beta),ratio=Math.abs(det)<1e-9?NaN:a*Math.sin(beta-t)/(c*det),mu=Math.acos(Math.min(1,Math.abs(Math.cos(phi-beta))))/rad,force=Math.abs(Math.sin(t-beta))<1e-9?Infinity:Math.abs(tor*1000/(a*Math.sin(t-beta)));return {A:{x:0,y:0},B,C,D,ratio,mu,out:phi/rad,force}}
function draw(s){let cv=$('drawing'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);if(!s){ctx.fillStyle='#f88';ctx.font='22px sans-serif';ctx.fillText('此角度无法闭合',190,190);return}let {a,b,c,d}=state,extent=a+b+c+d,scale=Math.min((W-90)/Math.max(d+a+b,extent*.8), (H-80)/Math.max(a+b+c,30))*1.2,ox=W/2-d*scale/2,oy=H/2+25;const p=o=>[ox+o.x*scale,oy-o.y*scale];[[s.A,s.D,colors[3]],[s.A,s.B,colors[0]],[s.B,s.C,colors[1]],[s.D,s.C,colors[2]]].forEach(([v,w,color])=>{let [x,y]=p(v),[xx,yy]=p(w);ctx.strokeStyle=color;ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(xx,yy);ctx.stroke()});Object.entries({A:s.A,B:s.B,C:s.C,D:s.D}).forEach(([name,v])=>{let [x,y]=p(v);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();ctx.font='18px sans-serif';ctx.fillText(name,x+10,y-9)})}
function chart(){let cv=$('plot'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height,k=$('curve').value,arr=Array.from({length:361},(_,i)=>{let s=solve(i);return s?s[k]:null}),valid=arr.filter(x=>x!==null&&Number.isFinite(x));ctx.clearRect(0,0,W,H);if(!valid.length)return;let sorted=[...valid].sort((a,b)=>a-b),lo=sorted[Math.floor(sorted.length*.02)],hi=sorted[Math.floor(sorted.length*.98)];if(k==='mu'){lo=0;hi=90}else if(k==='force')lo=0;if(hi-lo<.001){lo-=1;hi+=1}let X=i=>44+i/360*(W-55),Y=v=>12+(hi-v)/(hi-lo)*(H-44);ctx.strokeStyle='#41526b';ctx.fillStyle='#c6d1de';ctx.font='13px sans-serif';for(let j=0;j<=4;j++){let v=lo+(hi-lo)*j/4,y=Y(v);ctx.beginPath();ctx.moveTo(44,y);ctx.lineTo(W-10,y);ctx.stroke();ctx.fillText(v.toFixed(1),3,y+4)}for(let i=0;i<=360;i+=90)ctx.fillText(i+'°',X(i)-10,H-8);ctx.beginPath();let active=false;arr.forEach((v,i)=>{if(v===null||!Number.isFinite(v)||v<lo||v>hi){active=false;return}if(!active){ctx.moveTo(X(i),Y(v));active=true}else ctx.lineTo(X(i),Y(v))});ctx.strokeStyle='#39c5b7';ctx.lineWidth=3;ctx.stroke();ctx.strokeStyle='#f4ad4e';ctx.beginPath();ctx.moveTo(X(state.ang),12);ctx.lineTo(X(state.ang),H-32);ctx.stroke()}
function ranges(){
// Sample a full revolution, then unwrap the output angles to avoid false 360° jumps.
const N=1440, vals=Array.from({length:N+1},(_,i)=>solve(i*360/N));
const valid=vals.map(Boolean);let segments=[],start=-1;
for(let i=0;i<=N;i++){if(valid[i]&&start<0)start=i;if((!valid[i]||i===N)&&start>=0){let end=valid[i]?i:i-1;segments.push([start*360/N,end*360/N]);start=-1}}
let raw=vals.filter(Boolean).map(v=>v.out),unwrapped=[];
for(const v of raw){if(!unwrapped.length){unwrapped.push(v);continue}let u=v;const prev=unwrapped[unwrapped.length-1];while(u-prev>180)u-=360;while(u-prev< -180)u+=360;unwrapped.push(u)}
let min=Math.min(...unwrapped),max=Math.max(...unwrapped);
// When the output makes a complete revolution, display a full 360° span.
let full=segments.length===1&&segments[0][0]===0&&segments[0][1]===360;
const fmt=v=>Number(v.toFixed(1));
let input=full?'0°～360°（可整周旋转）':segments.length?segments.map(([a,b])=>`${fmt(a)}°～${fmt(b)}°`).join('、'):'无可装配角度';
let output=raw.length?`${fmt(min)}°～${fmt(max)}°`:'无可装配角度';
$('angle-ranges').innerHTML=`<div class="stat"><small>曲柄可运动范围（相对机架）</small><b style="font-size:16px;overflow-wrap:anywhere">${input}</b></div><div class="stat"><small>摇杆运动角范围（连续展开）</small><b style="font-size:16px">${output}</b></div><div class="stat"><small>摇杆总摆角</small><b>${raw.length?fmt(max-min)+'°':'—'}</b></div><div class="stat"><small>当前曲柄 / 摇杆角</small><b style="font-size:16px">${(()=>{let x=solve(state.ang);return x?fmt(state.ang)+'° / '+fmt(x.out)+'°':'无解'})()}</b></div>`;
$('range-note').textContent='角度以机架向右为 0°，逆时针为正；摇杆角连续展开以避免 ±180° 跳变。角度范围按 0.25° 采样估算，非精确极限位置；无法闭合的输入角不会计入。';
}
function update(){keys.forEach(k=>{$('s'+k).value=state[k];$('v'+k).textContent=state[k]+' mm';if(document.activeElement!==$('n'+k))$('n'+k).value=state[k]});$('ang').value=state.ang;$('angval').textContent=Math.round(state.ang)+'°';$('tor').value=state.tor;$('torval').textContent=state.tor.toFixed(2)+' Nm';if(document.activeElement!==$('ntor'))$('ntor').value=state.tor;let s=solve(state.ang);draw(s);let entries=[['输出角',s?.out,'°'],['传动角',s?.mu,'°'],['角速度比',s?.ratio,''],['输出扭矩',s&&Math.abs(s.ratio)>1e-8?Math.abs(state.tor/s.ratio):NaN,' Nm'],['连杆轴向力',s?.force,' N'],['可装配角度占比',Array.from({length:360},(_,i)=>solve(i)).filter(Boolean).length/3.6,'%']];$('stats').innerHTML=entries.map(([name,v,u])=>`<div class="stat"><small>${name}</small><b>${Number.isFinite(v)?v.toFixed(name==='角速度比'?3:1)+u:'—'}</b></div>`).join('');chart();ranges();save()}update();let last=0;function tick(t){if(running&&t-last>40){state.ang=(state.ang+1)%360;update();last=t}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></body></html>
